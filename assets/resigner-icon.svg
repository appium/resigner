<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">resigner icon</title>
  <desc id="description">An app package being re-signed with a verified certificate</desc>

  <rect width="512" height="512" rx="112" fill="#111827"/>

  <!-- App package -->
  <rect x="88" y="114" width="302" height="270" rx="52" fill="#F8FAFC"/>
  <path d="M88 184h302" stroke="#CBD5E1" stroke-width="12"/>
  <circle cx="132" cy="149" r="11" fill="#3B82F6"/>
  <circle cx="169" cy="149" r="11" fill="#93C5FD"/>
  <path d="M145 245h153M145 293h105" stroke="#94A3B8" stroke-linecap="round" stroke-width="18"/>

  <!-- Previous signature -->
  <path d="m156 364-6 38 19-11 16 17 8-39" fill="#475569" stroke="#111827" stroke-linejoin="round" stroke-width="7"/>
  <circle cx="170" cy="340" r="32" fill="#64748B" stroke="#111827" stroke-width="7"/>
  <path d="M156 340h28" stroke="#F8FAFC" stroke-linecap="round" stroke-width="9"/>

  <!-- Replace with a new signature -->
  <path d="M218 340h48" stroke="#3B82F6" stroke-linecap="round" stroke-width="14"/>
  <path d="m294 340-30-19v38Z" fill="#3B82F6"/>

  <!-- Verified signing certificate -->
  <path d="m336 386-13 61 38-20 30 33 13-68" fill="#16A34A" stroke="#111827" stroke-linejoin="round" stroke-width="9"/>
  <circle cx="360" cy="350" r="58" fill="#22C55E" stroke="#111827" stroke-width="10"/>
  <path d="m331 350 20 20 41-46" fill="none" stroke="#F8FAFC" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"/>
</svg>
